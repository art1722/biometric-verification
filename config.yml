# config.yml
# Biometric data QC configuration
#
# Source tags:
# [SPEC]    = official project specification PDF
# [PLAN]    = PROJECT_PLAN.md / 4th meeting plan
# [REPO]    = researcher Face-Verification example repo
# [DESIGN]  = implementation choice, not from spec
# [CONFIRM] = should be confirmed with researcher
#
# NOTE on ID width: Phase 0 has NOT settled whether IDs are zero-padded to a
# fixed width. The spec only SHOWS examples (001_face_rgb.mp4, 0001_palm_L_N.jpg);
# it does not state the rule. Until confirmed, every filename pattern accepts
# an id of one or more digits ((?P<volunteer_id>\d+)), so no valid file is
# rejected on width. Tighten to a fixed width once the researcher confirms. [CONFIRM]

project:
  status_pass: "PASS"      # [DESIGN]
  status_fail: "FAIL"      # [DESIGN]
  status_skip: "SKIP"      # [DESIGN]
  status_review: "REVIEW"  # [DESIGN]

paths:
  input_root: "data"       # [DESIGN]
  report_dir: "reports"    # [DESIGN]
  report_csv: "reports/qc_report.csv"    # [DESIGN]
  report_json: "reports/qc_report.json"  # [DESIGN]

# --- filename validation (read by validate_filenames.py) ---
# Each required file = (key, regex). The regex MUST capture a named group
# `volunteer_id`. Width is one-or-more digits (\d+) until Phase 0 confirms. [CONFIRM]
filenames:
  id_width_policy: "any"   # [CONFIRM] any | fixed_3 | fixed_4
  required:
    face_rgb:        "^(?P<volunteer_id>\\d+)_face_rgb\\.mp4$"
    face_depth:   "^(?P<volunteer_id>\\d+)_face_depth\\.mp4$"
    face_ir1:     "^(?P<volunteer_id>\\d+)_face_ir1\\.mp4$"
    face_ir2:     "^(?P<volunteer_id>\\d+)_face_ir2\\.mp4$"
    face_thermal: "^(?P<volunteer_id>\\d+)_face_thermal\\.mp4$"
    palm_L_N:        "^(?P<volunteer_id>\\d+)_palm_L_N\\.jpg$"
    palm_L_RL:       "^(?P<volunteer_id>\\d+)_palm_L_RL\\.jpg$"
    palm_L_RR:       "^(?P<volunteer_id>\\d+)_palm_L_RR\\.jpg$"
    palm_L_PU:       "^(?P<volunteer_id>\\d+)_palm_L_PU\\.jpg$"
    palm_L_PD:       "^(?P<volunteer_id>\\d+)_palm_L_PD\\.jpg$"
    palm_R_N:        "^(?P<volunteer_id>\\d+)_palm_R_N\\.jpg$"
    palm_R_RL:       "^(?P<volunteer_id>\\d+)_palm_R_RL\\.jpg$"
    palm_R_RR:       "^(?P<volunteer_id>\\d+)_palm_R_RR\\.jpg$"
    palm_R_PU:       "^(?P<volunteer_id>\\d+)_palm_R_PU\\.jpg$"
    palm_R_PD:       "^(?P<volunteer_id>\\d+)_palm_R_PD\\.jpg$"
    walk_F:          "^(?P<volunteer_id>\\d+)_walk_F\\.mp4$"
    walk_S:          "^(?P<volunteer_id>\\d+)_walk_S\\.mp4$"

video:
  sample_fps: 1            # [DESIGN] sample 1 frame/sec for model-based checks
  sample_first_frame: true # [DESIGN]
  sample_last_frame: true  # [DESIGN]
  max_frames: 6000         # [DESIGN] safety cap on a very long video

models:
  mediapipe:
    static_image_mode: true          # [REPO] (legacy face_det only; landmarker uses running_mode=IMAGE)
    max_num_faces: 10                # [REPO] repo used 10; pipelines take first/largest
    min_detection_confidence: 0.6    # [REPO]
    refine_landmarks: true

  # Tasks-API Face Landmarker — produces landmarks AND blendshapes in one pass.
  # Required for the blendshape-based eyes-open check (eyeBlinkLeft/Right).
  # Download the .task bundle once (see verify_env.py / README):
  #   https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
  face_landmarker:                   # [DESIGN] new in Tasks-API migration
    model_path: "models/face_landmarker.task"   # [CONFIRM] where the bundle lives
    min_face_presence_confidence: 0.5
    min_tracking_confidence: 0.5

  face_detection:
    model_selection: 1               # [REPO]
    min_detection_confidence: 0.5    # [REPO/code behavior]

  # Tasks-API Hand Landmarker — palm-side mirror of face_landmarker.
  # Produces 21 hand landmarks (image + world space) + handedness in one pass.
  # Required for the palm size/angle checks (bbox from landmarks, roll/pitch
  # from world landmarks). Download the .task bundle once (see verify_env.py):
  #   https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
  hand_landmarker:                   # [DESIGN] palm pipeline, Tasks-API
    model_path: "models/hand_landmarker.task"   # [CONFIRM] where the bundle lives
    min_hand_presence_confidence: 0.5
    min_tracking_confidence: 0.5

  hands:
    max_num_hands: 1                 # [DESIGN]
    min_detection_confidence: 0.5    # [DESIGN]
    # Palm screening: a second hand in frame is a capture error (spec wants ONE
    # hand per shot), so >1 hand -> FAIL, NOT REVIEW. Contrast face, where a
    # second (background) face -> REVIEW because the spec does not forbid it.
    multiple_hands_policy: "FAIL"    # [CONFIRM]

  pose:
    min_detection_confidence: 0.5    # [DESIGN]
    min_tracking_confidence: 0.5     # [DESIGN]


face:
  extension: ".mp4"                  # [SPEC]
  container: "MPEG-4"                # [SPEC]

  streams:
    rgb:
      required: true
      pattern_key: "face_rgb"
      require_rgb: true              # [SPEC]
      checks:
        metadata: true
        face_size: true
        blur: true
        brightness: true
        head_fully_visible: true
        head_pose: true
        eyes_open: true
        occlusion: true
        turn_sequence: true

    depth:
      required: true
      pattern_key: "face_depth"
      require_rgb: false
      checks:
        metadata: true
        face_size: false             # [PLAN] RGB face model may fail on depth
        blur: false                  # [PLAN]
        brightness: false            # [PLAN]
        head_fully_visible: false    # [PLAN]
        head_pose: false             # [PLAN]
        eyes_open: false             # [PLAN]
        occlusion: false             # [PLAN]
        turn_sequence: false         # [PLAN]

    ir1:
      required: true
      pattern_key: "face_ir1"
      require_rgb: false
      checks:
        metadata: true
        face_size: true              # [PLAN] try face checks on IR
        blur: true                   # [PLAN]
        brightness: true             # [PLAN]
        head_fully_visible: true     # [PLAN]
        head_pose: true              # [PLAN]
        eyes_open: false             # [DESIGN] eye check may be unreliable on IR
        occlusion: false             # [DESIGN]
        turn_sequence: true          # [PLAN] if head pose works

    ir2:
      required: true
      pattern_key: "face_ir2"
      require_rgb: false
      checks:
        metadata: true
        face_size: true              # [PLAN] try face checks on IR
        blur: true                   # [PLAN]
        brightness: true             # [PLAN]
        head_fully_visible: true     # [PLAN]
        head_pose: true              # [PLAN]
        eyes_open: false             # [DESIGN] eye check may be unreliable on IR
        occlusion: false             # [DESIGN]
        turn_sequence: true          # [PLAN] if head pose works

    thermal:
      required: true
      pattern_key: "face_thermal"
      require_rgb: false
      checks:
        metadata: true
        face_size: false             # [PLAN] RGB face model may fail on thermal
        blur: false                  # [PLAN]
        brightness: false            # [PLAN]
        head_fully_visible: false    # [PLAN]
        head_pose: false             # [PLAN]
        eyes_open: false             # [PLAN]
        occlusion: false             # [PLAN]
        turn_sequence: false         # [PLAN]

  required_sets:
    rgb:
      - "rgb"
    depth_ir_thermal:
      - "depth"
      - "ir1"
      - "ir2"
      - "thermal"

  metadata:
    min_fps: 5                       # [SPEC]
    min_duration_sec: 40             # [SPEC] confirm applies to all 4 thermal streams [CONFIRM]

  size:
    min_head_width_px: 180           # [SPEC]
    min_head_height_px: 180          # [SPEC]

  visibility:
    require_head_to_neck_visible: true   # [SPEC]
    require_clear_face: true             # [SPEC]
    require_enough_light: true           # [SPEC]
    require_head_straight: true          # [SPEC]
    require_eye_level_camera: true       # [SPEC] no detector yet -> emit SKIP
    require_no_occlusion: true           # [SPEC]

  occlusion:
    no_hair_covering_face_or_eyes: true  # [SPEC]
    no_mask: true                        # [SPEC]
    no_sunglasses: true                  # [SPEC]
    no_hat: true                         # [SPEC]
    policy: "FAIL"                     # [DESIGN]

    # [DESIGN] Skin-colour occlusion method (check_occlusion.py). The landmark
    # model cannot report occlusion (it hallucinates covered landmarks with no
    # confidence signal), so occlusion is detected by appearance: build a small
    # ROI per face region from the landmarks, and test what fraction of each
    # region's pixels are skin-coloured in YCrCb. A required region whose skin
    # fraction falls below min_skin_ratio is flagged occluded.
    skin:
      # Which regions FAIL the frame if occluded. Eyes+nose+mouth are the
      # spec-critical cases (mask = nose+mouth; sunglasses = eyes). Add
      # "forehead" if a hat brim / low hair must also fail.
      required_regions: ["left_eye", "right_eye", "nose", "mouth"]  # [DESIGN]
      # YCrCb skin-chroma bounds (inclusive). Classic face-skin range; widen
      # cr/cb if darker or lighter skin tones false-fail in the real data.
      cr_min: 133                        # [DESIGN] tune on real volunteers
      cr_max: 173                        # [DESIGN]
      cb_min: 77                         # [DESIGN]
      cb_max: 127                        # [DESIGN]
      # A region passes if its skin-pixel fraction >= this. Lower = more
      # permissive (fewer false occlusions); higher = stricter.
      min_skin_ratio: 0.40               # [DESIGN] calibrate with อ.เหมียว
      # Padding added to each region ROI, as a fraction of the ROI's own size.
      roi_margin: 0.15                   # [DESIGN]

  turn_sequence:
    enabled: true                    # [SPEC]
    total_min_duration_sec: 40       # [SPEC]
      
    # "exact": observed sequence must equal an accepted order exactly.
    # "contiguous_subsequence": accepted order may appear as one contiguous
    # window inside the observed sequence; prefix/suffix noise is ignored.
    # Use exact for final/spec QC; use contiguous_subsequence for legacy data
    # where volunteers may have turned before pressing/after stopping record.
    sequence_match_mode: "exact"
    order_policy: "FAIL"        # [DESIGN] no human-review capacity at 1,500 scale;
                                # a turn-order mismatch is a non-conforming file -> FAIL.
                                # (was REVIEW)
    short_hold_policy: "FAIL"   # [DESIGN] a turn held < its minimum duration did not
                                # meet the spec's hold time -> FAIL. (was hard-coded
                                # REVIEW)
    unconfirmed_gap_policy: "FAIL"  # [DESIGN] a no-face gap Phase 1 cannot positively
                                # confirm as a real turn. No human reviewer exists, so
                                # this resolves to a decision rather than REVIEW.
                                # NOTE: this is the one mode where the system admits it
                                # CANNOT assess the frame — setting FAIL means such files
                                # are rejected outright. Set to "REVIEW" only if a human
                                # will actually look.
    accepted_orders:
      spec:
        - "front"
        - "left"
        - "front"
        - "right"
        - "front"
        - "down"
        - "front"
        - "up"
        - "front"
      audio_prompt:
        - "front"
        - "left"
        - "front"
        - "right"
        - "front"
        - "up"
        - "front"
        - "down"
        - "front"

    hold_seconds:
      front_initial: 5
      front_between_movements: 2
      left: 2
      right: 2
      down: 2
      up: 2

    tolerance:
      side_yaw_tolerance_deg: 30      # [DESIGN] guess - spec says ~90deg turn
      tilt_pitch_tolerance_deg: 20    # [DESIGN] guess
      min_detected_step_ratio: 0.6    # [DESIGN] guess - fraction of states seen
      front_zone_yaw_deg: 15          # [DESIGN] guess - calibrate vs opening front hold
      front_zone_pitch_deg: 15        # [DESIGN] guess - calibrate vs opening front hold
      label_jitter_tolerance_sec: 0.15

  checks:
    detection:                       # [DESIGN] 2026-06: expected/unexpected gap split.
                                     # A no-face frame is judged by WHERE it sits:
                                     #   expected   = its gap run was absorbed into a
                                     #                turn (>=1 detected over-floor
                                     #                frame immediately adjacent) ->
                                     #                the protocol asked the face to be
                                     #                unmeasurable here; not a defect.
                                     #   unexpected = anywhere else (e.g. during a front
                                     #                hold) -> the face should have been
                                     #                visible; a real defect.
                                     # Frames with MULTIPLE faces are a different defect
                                     # class (someone else in frame) and always stay
                                     # REVIEW regardless of these settings.
      expected_gap_status: "SKIP"    # [CONFIRM] not judged; excluded from fail ratio
      unexpected_gap_status: "FAIL"  # [CONFIRM] counts toward frame_fail_ratio
    face_size:
      threshold_px: 180              # [SPEC], not repo 150
    blur:
      threshold: 50.0                # [DESIGN] Tenengrad/Sobel after CLAHE, not old Laplacian=90
      resize_px: 224                 # [DESIGN] fixed crop size makes scores less face-size dependent
      crop_margin: 0.15              # [DESIGN] inner face crop; reduces hair/background edge bias
      min_luma: 35.0                 # [DESIGN] below this, blur is SKIP; brightness owns the FAIL
      min_contrast: 4.0              # [DESIGN] below this, blur is SKIP; insufficient edge evidence

      # Preprocessing before Tenengrad/Sobel sharpness.
      # Options:
      #   none   = raw luminance
      #   clahe  = current behavior
      #   lideg  = LIDE simple Gaussian
      #   lidel  = LIDE simple Laplacian
      preprocess: "clahe"

      # CLAHE params
      clahe_clip_limit: 2.0
      clahe_tile_grid_size: 8

      # LIDE params
      # Note: README example uses d=100, but your face ROI is resized to 224x224.
      # d=100 means a 201x201 local window, almost the whole face crop.
      # For QC experiments, start smaller.
      lide_d: 30
      lide_sigma_min: 30.0

    brightness:
      dark_threshold: 35             # [REPO]
      bright_threshold: 200          # [REPO]
      diff_threshold: 20             # [REPO]
      margin: 0.1                    # [REPO]
    head_fully_visible:
      margin_px: 10                  # [REPO]
    eyes_open:
      blink_threshold: 0.5           # [DESIGN] Face Landmarker blendshape method.
                                     # eyeBlinkLeft/Right is a trained closed-ness
                                     # score in [0,1]; an eye is OPEN when its
                                     # blink score < this. 0.5 is the natural
                                     # midpoint starting point — CALIBRATE with a
                                     # deliberate closed-eye clip, since the model
                                     # tends to read clearly-closed eyes near ~0.9
                                     # and open eyes near ~0.0-0.1. [CONFIRM]
                                     # (Replaced the old EAR ratio + ear_threshold,
                                     # which needed per-video calibration and broke
                                     # off-frontal. EAR kept only as a fallback in
                                     # check_eye.check_eye_status_ear.)
    head_pose:
      left_th: -0.3                  # [REPO]
      right_th: 0.3                  # [REPO]
      down_th: -10                   # [REPO]
      up_th: 15                      # [REPO]
      til_left_th: -0.10             # [REPO]
      til_right_th: 0.10             # [REPO]


palm:
  extension: ".jpg"                  # [SPEC]
  pattern_keys:
    - "palm_L_N"
    - "palm_L_RL"
    - "palm_L_RR"
    - "palm_L_PU"
    - "palm_L_PD"
    - "palm_R_N"
    - "palm_R_RL"
    - "palm_R_RR"
    - "palm_R_PU"
    - "palm_R_PD"

  hands: ["L", "R"]                  # [SPEC]
  poses: ["N", "RL", "RR", "PU", "PD"]   # [SPEC]
  expected_files_per_volunteer: 10   # [SPEC] 2 hands x 5 poses

  size:
    min_width_px: 200                # [SPEC]
    min_height_px: 200               # [SPEC]

  quality:
    require_bright_and_clear: true   # [SPEC]
    require_visible_veins: true      # [SPEC]
    visible_veins_policy: "FAIL"     # [DESIGN]

  # Runtime thresholds for check_palm_brightness (mean V inside the hand bbox).
  # Reuses the shared brightness core (qc/checks/check_brightness.py). Defaults
  # mirror face; palm skin under the capture rig may differ and "veins visible"
  # is a CONTRAST cue mean-V alone does not capture -- validate on real samples
  # before trusting these. [CONFIRM with อ.เหมียว]
  brightness:
    enabled: true                    # [DESIGN] config toggle, like the angle gate
    dark_threshold: 35.0             # [ASSUMPTION] inherited from face default
    bright_threshold: 200.0          # [ASSUMPTION] inherited from face default
    margin: 0.1                      # [DESIGN] trim each side of the hand bbox

  obstruction:
    require_no_jewelry: true         # [SPEC]
    jewelry_policy: "FAIL"           # [DESIGN]

  hand_pose:
    require_palm_open: true                  # [SPEC]
    require_all_five_fingers_visible: true   # [SPEC]
    require_natural_finger_spread: true      # [SPEC]
    require_not_overly_tensed: true          # [SPEC]

    # check_palm_spread: angular gap between adjacent fingers (MCP->TIP vectors).
    # Quality check -- enforced on the NEUTRAL (N) pose only, because RL/RR/PU/PD
    # tilt the hand out of the image plane and distort an in-plane spread angle.
    # [DESIGN -> CONFIRM with อ.เหมียว]: N-only scoping deviates from the spec's
    # "spread in every shot" wording; turn-pose spread is unreliable to measure.
    spread:
      enabled: true                  # [DESIGN] config toggle, like the angle gate
      eval_poses: ["N"]              # [DESIGN] only enforce spread on neutral
      # Source-aware floors (degrees). MediaPipe extrapolates cropped fingertips
      # (coords can fall outside [0,1]), so the check picks ONE hand-wide source:
      # tips if every required finger's tip is in-frame, else PIPs. tip-tip gaps
      # fan wider than pip-pip gaps, so each source has its own floors. All
      # [ASSUMPTION] -- calibrate on real spread/closed samples.
      min_gap_inter_tip_deg: 5.0     # index-middle/middle-ring/ring-pinky (tip source)
      min_gap_thumb_tip_deg: 20.0    # thumb-index (tip source)
      min_gap_inter_pip_deg: 3.0     # inter-finger (pip source; PIPs fan less)
      min_gap_thumb_pip_deg: 12.0    # thumb-index (pip source)
      # A landmark must sit inside [margin, 1-margin] to count as in-frame; a
      # point at/over the edge is treated as cropped/extrapolated.
      frame_margin: 0.02             # [DESIGN]
      required_pairs:                # [DESIGN] gaps that FAIL the frame if closed
        - "thumb-index"
        - "index-middle"
        - "middle-ring"
        - "ring-pinky"

  angle:
    max_abs_roll_deg: 45             # [SPEC]
    max_abs_pitch_deg: 45            # [SPEC]
    check_angle_enabled: true       # [DESIGN] flip TRUE after sign calibration
    # --- Per-pose directional validation (check_palm_pose) ---
    # The spec gives each pose a DIRECTIONAL band, not a symmetric |angle|<=45:
    #   N : roll & pitch within +/- neutral_tol_deg
    #   RL: roll in [-45, -min_rotation_deg]   RR: roll in [+min_rotation_deg, +45]
    #   PU: pitch in [-45, -min_rotation_deg]  PD: pitch in [+min_rotation_deg, +45]
    max_abs_deg: 45                  # [SPEC] outer magnitude bound
    min_rotation_deg: 10             # [ASSUMPTION] a deliberate pose must rotate >= this; calibrate
    neutral_tol_deg: 10              # [ASSUMPTION] N must be within +/- this on both axes
    off_axis_tol_deg: 20             # [ASSUMPTION] a rotated pose's OTHER axis must stay within +/- this
    # !!! SIGN CALIBRATION PENDING !!! RL/RR motion is MIRRORED between L and R
    # hands, so the roll SIGN for a "correct" pose may flip with handedness. The
    # nominal spec signs are the starting hypothesis in code; if a reference
    # image measures the opposite sign, override it here, e.g.:
    #   hand_sign_overrides: { R: { RL: 1, RR: -1 } }
    # Leave empty until calibrated against one known-correct image per (hand,pose).
    hand_sign_overrides: {}          # [CONFIRM with อ.เหมียว]


walk:
  extension: ".mp4"                  # [SPEC]
  pattern_keys:
    - "walk_F"
    - "walk_S"

  views: ["F", "S"]                  # [SPEC]
  expected_files_per_volunteer: 2    # [SPEC]

  metadata:
    min_fps: 30                      # [SPEC]
    min_duration_sec: 15             # [SPEC]
    min_width_px: 1920               # [PLAN] concrete value for full HD
    min_height_px: 1080              # [PLAN] concrete value for full HD

  visibility:
    min_person_height_ratio: 0.5     # [SPEC]
    require_full_body_visible: true  # [SPEC]
    require_walking_pose_visible_every_frame: true  # [SPEC]

  recording:
    require_indoor_safe_area: true       # [SPEC] no detector -> SKIP
    require_no_obstacle: true            # [SPEC] no detector -> SKIP
    require_normal_clothing: true        # [SPEC] no detector -> SKIP
    require_F_walk_toward_and_back: true # [SPEC]
    require_S_walk_left_and_right: true  # [SPEC]
    require_two_cameras_simultaneous: true # [SPEC]

  sync:
    check_sync_enabled: false        # [DESIGN] simultaneous required, but no timestamp method defined

report:
  # Frame-level aggregation policy: a frame-level check FAILs the file only if
  # MORE than this fraction of its JUDGED frames (pass+fail+review; SKIPs
  # excluded) failed. A blink or a 2% transient on sampled frames is normal
  # human behaviour, not a QC defect. Same idea for REVIEW.
  # Applies ONLY to level=frame checks; video/sequence checks keep
  # worst-status aggregation. [DESIGN] ratio values to confirm. [CONFIRM]
  aggregation:
    frame_fail_ratio: 0.2
    frame_review_ratio: 0.2
    per_check_fail_ratio:
      check_face_detected: 0.0
  columns:
    - "volunteer_id"
    - "data_type"
    - "stream_or_view"
    - "filename"
    - "check_name"
    - "status"
    - "reason"
    - "measured_value"
    - "threshold"
    - "source"
  include_pass: true                 # [DESIGN]
  include_fail: true                 # [DESIGN]
  include_skip: true                 # [DESIGN]
  include_review: true               # [DESIGN]
  aggregate_by_volunteer: true       # [PLAN]