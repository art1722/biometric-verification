project:
  status_pass: "PASS"
  status_fail: "FAIL"
  status_skip: "SKIP"
  status_review: "REVIEW"

paths:
  input_root: "data"
  report_dir: "reports"
  report_csv: "reports/qc_report.csv"
  report_json: "reports/qc_report.json" 

filenames:
  id_width_policy: "any"   # any | fixed_3 | fixed_4
  required:
    face_rgb:        "^(?P<volunteer_id>\\d+)_face_rgb\\.mp4$"
    face_depth:   "^(?P<volunteer_id>\\d+)_face_depth\\.mp4$"
    face_ir1:     "^(?P<volunteer_id>\\d+)_face_ir1\\.mp4$"
    face_ir2:     "^(?P<volunteer_id>\\d+)_face_ir2\\.mp4$"
    face_thermal: "^(?P<volunteer_id>\\d+)_face_thermal\\.mp4$"
    palm_L_N:        "^(?P<volunteer_id>\\d+)_palm_L_N\\.jpg$"
    palm_L_RL:       "^(?P<volunteer_id>\\d+)_palm_L_RL\\.jpg$"
    palm_L_RR:       "^(?P<volunteer_id>\\d+)_palm_L_RR\\.jpg$"
    palm_L_PU:       "^(?P<volunteer_id>\\d+)_palm_L_PU\\.jpg$"
    palm_L_PD:       "^(?P<volunteer_id>\\d+)_palm_L_PD\\.jpg$"
    palm_R_N:        "^(?P<volunteer_id>\\d+)_palm_R_N\\.jpg$"
    palm_R_RL:       "^(?P<volunteer_id>\\d+)_palm_R_RL\\.jpg$"
    palm_R_RR:       "^(?P<volunteer_id>\\d+)_palm_R_RR\\.jpg$"
    palm_R_PU:       "^(?P<volunteer_id>\\d+)_palm_R_PU\\.jpg$"
    palm_R_PD:       "^(?P<volunteer_id>\\d+)_palm_R_PD\\.jpg$"
    walk_F:          "^(?P<volunteer_id>\\d+)_walk_F\\.mp4$"
    walk_S:          "^(?P<volunteer_id>\\d+)_walk_S\\.mp4$"

video:
  max_frames: 10000

models:
  face_landmarker:
    model_path: "models/face_landmarker.task"
    num_faces: 10
    min_face_detection_confidence: 0.6
    min_face_presence_confidence: 0.5
    min_tracking_confidence: 0.5

  face_detection:
    model_selection: 1
    min_detection_confidence: 0.5

  hand_landmarker:
    model_path: "models/hand_landmarker.task"

  hands:
    max_num_hands: 1
    min_detection_confidence: 0.1
    multiple_hands_policy: "FAIL"

  pose_landmarker:
    model_path: "models/pose_landmarker.task"
    num_poses: 10
    min_pose_detection_confidence: 0.5
    min_pose_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    min_real_visibility: 0.5
    min_real_landmarks: 8
    
  yolo:
    model_path: models/yolov8n.pt
    conf: 0.6


face:
  extension: ".mp4"
  container: "MPEG-4"

  metadata:
    min_fps: 5
    min_duration_sec: 40

  size:
    min_head_width_px: 180
    min_head_height_px: 180

  occlusion:
    policy: "FAIL"
    skin:
      required_regions: ["left_eye", "right_eye", "nose", "mouth"]
      cr_min: 133
      cr_max: 173
      cb_min: 77
      cb_max: 127
      min_skin_ratio: 0.40
      roi_margin: 0.15

  turn_sequence:
    enabled: true                    # [SPEC]
    total_min_duration_sec: 40       # [SPEC]
      
    # "exact": observed sequence must equal an accepted order exactly.
    # "contiguous_subsequence": accepted order may appear as one contiguous
    # window inside the observed sequence; prefix/suffix noise is ignored.
    # Use exact for final/spec QC; use contiguous_subsequence for legacy data
    # where volunteers may have turned before pressing/after stopping record.
    sequence_match_mode: "exact"
    order_policy: "FAIL"        # [DESIGN] no human-review capacity at 1,500 scale;
                                # a turn-order mismatch is a non-conforming file -> FAIL.
                                # (was REVIEW)
    short_hold_policy: "FAIL"   # [DESIGN] a turn held < its minimum duration did not
                                # meet the spec's hold time -> FAIL. (was hard-coded
                                # REVIEW)
    unconfirmed_gap_policy: "FAIL"  # [DESIGN] a no-face gap Phase 1 cannot positively
                                # confirm as a real turn. No human reviewer exists, so
                                # this resolves to a decision rather than REVIEW.
                                # NOTE: this is the one mode where the system admits it
                                # CANNOT assess the frame — setting FAIL means such files
                                # are rejected outright. Set to "REVIEW" only if a human
                                # will actually look.
    accepted_orders:
      spec:
        - "front"
        - "left"
        - "front"
        - "right"
        - "front"
        - "down"
        - "front"
        - "up"
        - "front"
      audio_prompt:
        - "front"
        - "left"
        - "front"
        - "right"
        - "front"
        - "up"
        - "front"
        - "down"
        - "front"

    hold_seconds:
      front_initial: 5
      front_between_movements: 2
      left: 2
      right: 2
      down: 2
      up: 2

    tolerance:
      side_yaw_tolerance_deg: 30      # [DESIGN] guess - spec says ~90deg turn
      tilt_pitch_tolerance_deg: 20    # [DESIGN] guess
      min_detected_step_ratio: 0.6    # [DESIGN] guess - fraction of states seen
      front_zone_yaw_deg: 15          # [DESIGN] guess - calibrate vs opening front hold
      front_zone_pitch_deg: 15        # [DESIGN] guess - calibrate vs opening front hold
      label_jitter_tolerance_sec: 0.15

  checks:
    detection:                       # [DESIGN] 2026-06: expected/unexpected gap split.
                                     # A no-face frame is judged by WHERE it sits:
                                     #   expected   = its gap run was absorbed into a
                                     #                turn (>=1 detected over-floor
                                     #                frame immediately adjacent) ->
                                     #                the protocol asked the face to be
                                     #                unmeasurable here; not a defect.
                                     #   unexpected = anywhere else (e.g. during a front
                                     #                hold) -> the face should have been
                                     #                visible; a real defect.
                                     # Frames with MULTIPLE faces are a different defect
                                     # class (someone else in frame) and always stay
                                     # REVIEW regardless of these settings.
      expected_gap_status: "SKIP"    # [CONFIRM] not judged; excluded from fail ratio
      unexpected_gap_status: "FAIL"  # [CONFIRM] counts toward frame_fail_ratio
    face_size:
      threshold_px: 180              # [SPEC], not repo 150
    blur:
      threshold: 50.0                # [DESIGN] Tenengrad/Sobel after CLAHE, not old Laplacian=90
      resize_px: 224                 # [DESIGN] fixed crop size makes scores less face-size dependent
      crop_margin: 0.15              # [DESIGN] inner face crop; reduces hair/background edge bias
      min_luma: 35.0                 # [DESIGN] below this, blur is SKIP; brightness owns the FAIL
      min_contrast: 4.0              # [DESIGN] below this, blur is SKIP; insufficient edge evidence

      # Preprocessing before Tenengrad/Sobel sharpness.
      # Options:
      #   none   = raw luminance
      #   clahe  = current behavior
      #   lideg  = LIDE simple Gaussian
      #   lidel  = LIDE simple Laplacian
      preprocess: "clahe"

      # CLAHE params
      clahe_clip_limit: 2.0
      clahe_tile_grid_size: 8

      # LIDE params
      # Note: README example uses d=100, but your face ROI is resized to 224x224.
      # d=100 means a 201x201 local window, almost the whole face crop.
      # For QC experiments, start smaller.
      lide_d: 30
      lide_sigma_min: 30.0

    brightness:
      dark_threshold: 35             # [REPO]
      bright_threshold: 220          # [REPO]
      diff_threshold: 20             # [REPO]
      margin: 0.1                    # [REPO]
    head_fully_visible:
      margin_px: 10                  # [REPO]
    eyes_open:
      blink_threshold: 0.5           # [DESIGN] Face Landmarker blendshape method.
                                     # eyeBlinkLeft/Right is a trained closed-ness
                                     # score in [0,1]; an eye is OPEN when its
                                     # blink score < this. 0.5 is the natural
                                     # midpoint starting point — CALIBRATE with a
                                     # deliberate closed-eye clip, since the model
                                     # tends to read clearly-closed eyes near ~0.9
                                     # and open eyes near ~0.0-0.1. [CONFIRM]
                                     # (Replaced the old EAR ratio + ear_threshold,
                                     # which needed per-video calibration and broke
                                     # off-frontal. EAR kept only as a fallback in
                                     # check_eye.check_eye_status_ear.)
    head_pose:
      left_th: -0.3                  # [REPO]
      right_th: 0.3                  # [REPO]
      down_th: -10                   # [REPO]
      up_th: 15                      # [REPO]
      til_left_th: -0.10             # [REPO]
      til_right_th: 0.10             # [REPO]


palm:
  extension: ".jpg"                  # [SPEC]
  pattern_keys:
    - "palm_L_N"
    - "palm_L_RL"
    - "palm_L_RR"
    - "palm_L_PU"
    - "palm_L_PD"
    - "palm_R_N"
    - "palm_R_RL"
    - "palm_R_RR"
    - "palm_R_PU"
    - "palm_R_PD"

  hands: ["L", "R"]                  # [SPEC]
  poses: ["N", "RL", "RR", "PU", "PD"]   # [SPEC]
  expected_files_per_volunteer: 10   # [SPEC] 2 hands x 5 poses

  size:
    min_width_px: 200                # [SPEC]
    min_height_px: 200               # [SPEC]

  # Palm-fully-visible: the whole hand must be inside the frame (wrist and upper
  # palm not cut by an edge). Palm-side mirror of face.visibility + head_fully.
  # check_palm_fully anchors on WRIST (0) and MIDDLE_FINGER_MCP (9).
  visibility:
    check_palm_fully_enabled: true   # [DESIGN -> CONFIRM] toggle like other palm checks
    margin_px: 10                    # [DESIGN] mirrors face head_fully.margin_px

  quality:
    require_bright_and_clear: true   # [SPEC]
    require_visible_veins: true      # [SPEC]
    visible_veins_policy: "FAIL"     # [DESIGN]

  # Runtime thresholds for check_palm_brightness (mean V inside the hand bbox).
  # Reuses the shared brightness core (qc/checks/check_brightness.py). Defaults
  # mirror face; palm skin under the capture rig may differ and "veins visible"
  # is a CONTRAST cue mean-V alone does not capture -- validate on real samples
  # before trusting these. [CONFIRM]
  brightness:
    enabled: true                    # [DESIGN] config toggle, like the angle gate
    dark_threshold: 35.0             # [ASSUMPTION] inherited from face default
    bright_threshold: 220.0          # [ASSUMPTION] inherited from face default
    margin: 0.1                      # [DESIGN] trim each side of the hand bbox

  obstruction:
    require_no_jewelry: true         # [SPEC]
    jewelry_policy: "FAIL"           # [DESIGN]

  hand_pose:
    require_palm_open: true                  # [SPEC]
    require_all_five_fingers_visible: true   # [SPEC]
    require_natural_finger_spread: true      # [SPEC]
    require_not_overly_tensed: true          # [SPEC]

    # check_palm_spread: angular gap between adjacent fingers (MCP->TIP vectors).
    # Quality check -- enforced on the NEUTRAL (N) pose only, because RL/RR/PU/PD
    # tilt the hand out of the image plane and distort an in-plane spread angle.
    # [DESIGN -> CONFIRM]: N-only scoping deviates from the spec's
    # "spread in every shot" wording; turn-pose spread is unreliable to measure.
    spread:
      enabled: true                  # [DESIGN] config toggle, like the angle gate
      eval_poses: ["N"]              # [DESIGN] only enforce spread on neutral
      # Source-aware floors (degrees). MediaPipe extrapolates cropped fingertips
      # (coords can fall outside [0,1]), so the check picks ONE hand-wide source:
      # tips if every required finger's tip is in-frame, else PIPs. tip-tip gaps
      # fan wider than pip-pip gaps, so each source has its own floors. All
      # [ASSUMPTION] -- calibrate on real spread/closed samples.
      min_gap_inter_tip_deg: 2.0     # index-middle/middle-ring/ring-pinky (tip source)
      min_gap_thumb_tip_deg: 15.0    # thumb-index (tip source)
      min_gap_inter_pip_deg: 2.0     # inter-finger (pip source; PIPs fan less)
      min_gap_thumb_pip_deg: 15.0    # thumb-index (pip source)
      # A landmark must sit inside [margin, 1-margin] to count as in-frame; a
      # point at/over the edge is treated as cropped/extrapolated.
      frame_margin: 0.02             # [DESIGN]
      required_pairs:                # [DESIGN] gaps that FAIL the frame if closed
        - "thumb-index"
        - "index-middle"
        - "middle-ring"
        - "ring-pinky"

  angle:
    max_abs_roll_deg: 45             # [SPEC]
    max_abs_pitch_deg: 45            # [SPEC]
    check_angle_enabled: true       # [DESIGN] flip TRUE after sign calibration
    # --- depth-wise measurement (check_palm_angle.calculate_palm_angles) ---
    # Spec roll is NOT in-plane rotation. It is side-edge depth tilt: thumb/index
    # side vs pinky side closer to the sensor. Pitch is wrist side vs upper/finger
    # side closer to the sensor. Signs are normalized to the spec labels:
    #   RL negative, RR positive, PU negative, PD positive.
    # --- Grading (run_palm_participant) ---
    #   N : graded ABSOLUTELY -- researchers expect roll ~ 0 AND pitch ~ 0;
    #       tolerance n_reference_max_deg. A FAILed-but-measurable N still
    #       yields deltas, but the rotated verdicts are demoted to REVIEW
    #       ("delta may be biased -- re-capture N"). [DESIGN -> CONFIRM]
    #   RL/RR/PU/PD: graded on the DELTA vs this hand's own N:
    #     RL: d_roll in [-45, -min_rotation_deg]   RR: d_roll in [+min_rotation_deg, +45]
    #     PU: d_pitch in [-45, -min_rotation_deg]  PD: d_pitch in [+min_rotation_deg, +45]
    #   PLUS the raw absolute cap |roll|,|pitch| <= max_abs_deg [SPEC], and the
    #   raw values are always reported next to the delta verdict.
    max_abs_deg: 45                  # [SPEC] outer magnitude bound (raw AND delta)
    min_rotation_deg: 10             # [ASSUMPTION] a deliberate pose must rotate >= this; calibrate
    neutral_tol_deg: 15              # [ASSUMPTION] used by the per-image absolute path (check_palm_pose)
    n_reference_max_deg: 15          # [ASSUMPTION] N must read |roll|,|pitch| <= this to be a trusted baseline; calibrate
    off_axis_tol_deg: 45             # [ASSUMPTION] a rotated pose's OTHER axis must stay within +/- this
    # SIGN CALIBRATION NOTE: this implementation normalizes signs to the spec
    # labels using the filename hand: RL=-, RR=+, PU=-, PD=+. If the production
    # rig uses a different z/mirroring convention, override specific pose signs
    # here after checking known-correct reference images, e.g.:
    #   hand_sign_overrides: { R: { RL: 1, RR: -1 } }
    # Calibrate on palm-side images only; dorsal/back-of-hand tests invert the
    # physical "toward the sensor" relation.
    hand_sign_overrides: {}          # [CONFIRM]

  handedness:
    # Does the detected hand match the filename hand (L/R)? Catches wrong-hand
    # submissions (e.g. a right hand saved as ..._palm_L_...).
    # Runs on the NEUTRAL (N) pose ONLY -- MediaPipe's left/right label is
    # unreliable on tilted/rotated palm poses (the same physical hand can flip
    # label between N and a pitch/roll pose).
    enabled: true                    # [DESIGN]
    # Relation between the filename hand and MediaPipe's label for a CORRECT file:
    #   "same"     -> L expects "Left",  R expects "Right"  (099 pipeline; DEFAULT)
    #   "opposite" -> L expects "Right", R expects "Left"   (if a rig mirrors)
    # Confirmed 2026-07-09 on 099 N pose (099_palm_L_N -> MediaPipe "Left").
    expected_relation: "same"        # [CONFIRM per rig]
    # A MATCHING label always PASSes. A MISMATCH only FAILs when MediaPipe is at
    # least this confident; a lower-confidence mismatch SKIPs (MediaPipe
    # handedness is flaky on palm poses, so an unsure disagreement should not
    # fail a possibly-correct file).
    min_confidence: 0.7              # [ASSUMPTION] mismatch FAIL threshold; tune on real scores


walk:
  extension: ".mp4"                  # [SPEC]
  pattern_keys:
    - "walk_F"
    - "walk_S"

  views: ["F", "S"]                  # [SPEC]
  expected_files_per_volunteer: 2    # [SPEC]

  metadata:
    min_fps: 30                      # [SPEC]
    min_duration_sec: 15             # [SPEC]
    min_width_px: 1920               # [PLAN] concrete value for full HD
    min_height_px: 1080              # [PLAN] concrete value for full HD

  visibility:
    min_person_height_ratio: 0.5     # [SPEC]
    require_full_body_visible: true  # [SPEC]
    require_walking_pose_visible_every_frame: true  # [SPEC]

  brightness:
    # [RESEARCHER 2026-07-14] Brightness checking is OFF for walk. Set true to
    # re-enable; the check code below is kept intact so flipping this back on
    # needs no code change. When false, walk.py emits NO check_brightness rows
    # (the check has no effect on any file's verdict).
    enabled: false
    # [DESIGN] Same numeric cutoffs as the face check (dark<35, bright>200), but
    # the walk verdict is INVERTED per the researcher decision (2026-07-13):
    #   face  : PASS when 35 <= brightness <= 200   (normal-lit)
    #   walk  : PASS when brightness < 35 OR > 200   (literally inverted)
    # NOTE: this inversion means a normally-lit walk clip FAILS
    # brightness and only a very dark / very bright clip passes. That is the
    # opposite of the spec wording ("not too glaring, not too dark"). Flagged
    # for confirmation, same discipline as the palm in-plane leak.
    dark_threshold: 35               # [FACE-ALIGNED]
    bright_threshold: 220            # [FACE-ALIGNED]
    margin: 0.1                      # trim each side of the body bbox before measuring
    # Video-level rule: overall brightness FAILS when >= this fraction of judged
    # frames fail. Kept SEPARATE from report.aggregation so walk can be tuned
    # without touching face. Wired via per_check_fail_ratio in run_walk.
    frame_fail_ratio: 0.2            # [SPEC-DERIVED] overall FAIL if >= 20% frames fail

  blur:
    # Person-blur reuses check_face_blur (region-agnostic Tenengrad scorer) on
    # the body bbox. Same default threshold as face; tune on real walk footage.
    threshold: 35.0                  # [FACE-ALIGNED]
    frame_fail_ratio: 0.2            # overall FAIL if >= 20% frames fail

  occlusion:
    # Foreign-object occlusion via a COCO YOLO detector. Only class 0=person is
    # allowed; any of the other 79 COCO classes in a frame FAILs that frame.
    # This IMPLEMENTS recording.require_no_obstacle (previously "no detector ->
    # SKIP"): with YOLO we can actually judge it per frame.
    enabled: true                    # [DESIGN] set false to skip the 2nd model
    conf: 0.6                       # [DESIGN] min confidence for a foreign object to count
    frame_fail_ratio: 0.2            # overall FAIL if >= 20% frames fail (same as brightness/blur)
    # Which non-person YOLO boxes to DRAW on the overlay (does NOT change the
    # PASS/FAIL logic, only the visualization):
    #   "all"        -> every non-person object (incl. off-to-the-side ones that
    #                   do NOT fail the frame), so you can see what YOLO saw.
    #   "overlap"    -> only objects overlapping the person (the ones that FAIL).
    overlay_draw: all                # [DESIGN] "all" | "overlap"
    # SIDE-view (_S) ONLY: switch from 2D box-overlap to the foot-band rule. An
    # object FAILs iff its lower edge is within +/- foot_band_ratio * person
    # height of the walker's planted-foot line (landmarks 31/32, max-y). Default
    # 0.10 -> a 20% band. null -> _S also keeps raw overlap. FRONT (_F) ALWAYS
    # uses overlap and ignores this. [DESIGN] pending sign-off.
    foot_band_ratio: 0.10

  direction:
    # check_walk_direction (sequence-level): F=toward+away via body scale, S=left+right via
    # centroid-x. [DESIGN] defaults pending validation on real _F/_S footage.
    smooth_window: 5                 # moving-average window over the frame series
    min_run: 3                       # consecutive frames of one polarity = a phase
    eps: 0.002                       # |delta| below this per step is treated as flat
    min_frames: 8                    # fewer usable frames -> SKIP (too short)

  # Per-frame fail-ratio for the other person checks (detected / fully). Same
  # 20% rule; kept here so all walk frame checks share one tunable place.
  frame_checks:
    person_detected_fail_ratio: 0.2
    person_fully_fail_ratio: 0.2

  recording:
    require_indoor_safe_area: true       # [SPEC] no detector -> SKIP
    require_no_obstacle: true            # [SPEC] no detector -> SKIP
    require_normal_clothing: true        # [SPEC] no detector -> SKIP
    require_F_walk_toward_and_back: true # [SPEC]
    require_S_walk_left_and_right: true  # [SPEC]
    require_two_cameras_simultaneous: true # [SPEC]

  sync:
    check_sync_enabled: false        # [DESIGN] simultaneous required, but no timestamp method defined

report:
  # Frame-level aggregation policy: a frame-level check FAILs the file only if
  # MORE than this fraction of its JUDGED frames (pass+fail+review; SKIPs
  # excluded) failed. A blink or a 2% transient on sampled frames is normal
  # human behaviour, not a QC defect. Same idea for REVIEW.
  # Applies ONLY to level=frame checks; video/sequence checks keep
  # worst-status aggregation. [DESIGN] ratio values to confirm. [CONFIRM]
  aggregation:
    frame_fail_ratio: 0.2
    frame_review_ratio: 0.2
    per_check_fail_ratio:
      check_face_detected: 0.0
      # Walk: a SECOND person in any single frame fails the whole video, exactly
      # like face's multiple-faces rule. check_single_person is emitted as a
      # level="video" row (worst-status, already ratio-exempt), so this 0.0 is a
      # documented backstop that also holds if the check is ever re-leveled to
      # "frame". The no-person case is graded separately on check_person_detected
      # at the normal 20% fail-ratio, so a walker briefly out of view is NOT
      # sunk by one frame.
      check_single_person: 0.0
  columns:
    - "volunteer_id"
    - "data_type"
    - "stream_or_view"
    - "filename"
    - "check_name"
    - "status"
    - "reason"
    - "measured_value"
    - "threshold"
    - "source"
  include_pass: true                 # [DESIGN]
  include_fail: true                 # [DESIGN]
  include_skip: true                 # [DESIGN]
  include_review: true               # [DESIGN]
  aggregate_by_volunteer: true       # [PLAN]